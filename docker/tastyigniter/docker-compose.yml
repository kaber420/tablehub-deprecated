version: '3.8'

services:
  app:
    build: .
    container_name: tastyigniter_app
    ports:
      - "8001:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mysql:8.0
    container_name: tastyigniter_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tastyigniter
      MYSQL_USER: tastyuser
      MYSQL_PASSWORD: tastypassword
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
